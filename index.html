<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JPRO Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-main: #111b21;
            --bg-header: #202c33;
            --bg-chat: #0b141a;
            --bg-input: #2a3942;
            --bg-hover: #202c33;
            --bg-active: #2a3942;
            --bg-divider: #0b141a;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --verde: #00a884;
            --msg-out: #005c4b;
            --msg-in: #202c33;
            --badge: #00a884;
            --rojo: #f44336;
        }
        [data-theme="light"] {
            --bg-main: #ffffff;
            --bg-header: #f0f2f5;
            --bg-chat: #efeae2;
            --bg-input: #f0f2f5;
            --bg-hover: #f5f6f6;
            --bg-active: #e9edef;
            --bg-divider: #d1d7db;
            --text-primary: #111b21;
            --text-secondary: #667781;
            --msg-out: #d9fdd3;
            --msg-in: #ffffff;
            --badge: #00a884;
            --rojo: #f44336;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #app { width: 100%; height: 100%; }
       .page { display: none; width: 100%; height: 100%; }
       .page.active { display: flex; }
       .tab-page { display: none; width: 100%; height: 100%; }
       .tab-page.active { display: flex; }
       .scrollbar-hide::-webkit-scrollbar { display: none; }
       .chat-item:hover { background-color: var(--bg-hover); }
       .filter-btn.active { background-color: var(--verde) !important; color: var(--bg-main) !important; }
       .blur-content { filter: blur(8px); pointer-events: none; user-select: none; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDWWb3B8oYYe_uiwllsDHsUtmzUv_SKcdU",
          authDomain: "jpro-chat.firebaseapp.com",
          projectId: "jpro-chat",
          storageBucket: "jpro-chat.firebasestorage.app",
          messagingSenderId: "533021046255",
          appId: "1:533021046255:web:0209ceff9564b1aa06721a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        const app = document.getElementById('app');

        let currentUser = null;
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let currentFilter = 'todos';
        let currentTab = 'chats';
        let selectedChatId = null;
        let showArchived = false;
        let showRestricted = false;
        let archivedUnlocked = false;
        let restrictedUnlocked = false;

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        setTheme(currentTheme);

        app.innerHTML = `
            <!-- LOGIN SOLO NÚMERO -->
            <div id="loginPage" class="page active flex-col items-center justify-center p-6" style="background-color: var(--bg-main)">
                <div class="w-full max-w-sm">
                    <div class="text-center mb-10">
                        <div class="w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center" style="background-color: var(--verde)">
                            <svg class="w-11 h-11 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.449C18.24 1.245 15.24 0.002 12.045 0 5.463 0.095 5.369.095 11.95c0 2.109.546 4.131 1.585 5.936L0 24l6.306-1.651c1.724.941 3.665 1.438 5.738 1.438h.005c6.581 0 11.95-5.368 11.95-11.95 0-3.194-1.242-6.194-3.479-8.388zM12.05 21.833c-1.821 0-3.606-.49-5.16-1.415l-.369-.219-3.741.98.998-3.647-.24-.374c-1.001-1.563-1.531-3.379-1.531-5.208 0-5.416 4.406-9.822 9.823-9.822 2.623 0 5.089 1.023 6.942 2.877 1.854 2.876 4.319 2.876 6.942 0 5.417-4.407 9.823-9.823 9.823zm5.398-7.349c-.296-.148-1.747-.862-2.018-.961-.271-.099-.469-.148-.667.148-.198.297-.764.961-.936 1.158-.173.198-.346.223-.642.074-.297-.148-1.254-.463-2.389-1.475-.883-.788-1.479-1.761-1.652-2.058-.173-.297-.018-.458.13-.605.134-.133.297-.347.445-.52.148-.174.198-.297.297-.495.099-.198.05-.371-.025-.519-.074-.148-.667-1.607-.914-2.201-.24-.578-.484-.499-.667-.509-.173-.01-.371-.012-.569-.012-.198 0-.519.074-.791.371s-1.039 1.015-1.039 2.475 1.064 2.871 1.212 3.068c.148.198 2.093 3.196 5.072 4.482.709.306 1.261.489 1.693.626.711.226 1.358.194 1.869.118.57-.085 1.747-.714 1.994-1.403.247-.69.247-1.281.173-1.403-.074-.122-.272-.196-.569-.345z"/></svg>
                        </div>
                        <h1 class="text-2xl font-normal mb-2" style="color: var(--text-primary)">Verifica tu número</h1>
                        <p class="text-sm" style="color: var(--text-secondary)">Ingresa tu número para continuar</p>
                    </div>
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <div class="rounded-lg px-4 py-3 w-20" style="background-color: var(--bg-input)">
                                <p class="text-xs mb-1" style="color: var(--verde)">Cod.</p>
                                <span style="color: var(--text-primary)">+51</span>
                            </div>
                            <div class="rounded-lg px-4 py-3 flex-1" style="background-color: var(--bg-input)">
                                <p class="text-xs mb-1" style="color: var(--verde)">Número de teléfono</p>
                                <input id="phoneInput" type="tel" placeholder="975 998 730" maxlength="9" class="w-full bg-transparent border-0 p-0 focus:ring-0 text-lg" style="color: var(--text-primary)">
                            </div>
                        </div>
                        <button id="loginBtn" class="w-full py-3 font-medium rounded-full mt-6" style="background-color: var(--verde); color: var(--bg-main)">SIGUIENTE</button>
                    </div>
                    <p id="errorMsg" class="text-red-500 text-center mt-4 text-sm h-4"></p>
                </div>
            </div>

            <!-- MAIN APP -->
            <div id="mainPage" class="page flex-col">
                <!-- HEADER -->
                <header class="px-4 py-3 flex items-center justify-between" style="background-color: var(--bg-header)">
                    <h1 class="text-xl font-medium" style="color: var(--text-primary)">JPRO</h1>
                    <div class="flex items-center gap-2">
                        <button id="cameraBtn" class="p-2 rounded-full hover:bg-[#2a3942]">
                            <svg class="w-6 h-6" style="color: var(--text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                        <div class="relative">
                            <button id="menuBtn" class="p-2 rounded-full hover:bg-[#2a3942]">
                                <svg class="w-6 h-6" style="color: var(--text-primary)" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2.9-2 2.9 2 2 2zm0 2c-1.1 0-2.9-2 2s.9 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2.9-2 2s.9 2 2-.9 2-2-.9-2-2-2z"/></svg>
                            </button>
                            <div id="menuDropdown" class="hidden absolute right-0 mt-1 w-52 rounded-md shadow-xl py-2 z-50" style="background-color: var(--bg-header)">
                                <button id="newGroupBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Nuevo grupo</button>
                                <button id="newBroadcastBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Nueva difusión</button>
                                <button id="restrictedBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Chats restringidos</button>
                                <button id="perfilBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Perfil</button>
                                <button id="configBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Configuración</button>
                                <div class="my-1 border-t" style="border-color: var(--bg-input)"></div>
                                <button id="logoutBtn" class="block w-full text-left px-4 py-3 hover:bg-[#2a3942]" style="color: var(--text-primary)">Cerrar sesión</button>
                            </div>
                        </div>
                    </div>
                </header>
                <!-- SEARCH BAR -->
                <div class="px-3 py-2" style="background-color: var(--bg-main)">
                    <div class="rounded-lg px-3 py-2 flex items-center gap-3" style="background-color: var(--bg-input)">
                        <svg class="w-5 h-5" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input id="searchInput" type="text" placeholder="Preguntar a Meta AI o buscar" class="flex-1 bg-transparent border-0 p-0 focus:ring-0 text-sm" style="color: var(--text-primary)">
                    </div>
                </div>

                <!-- FILTERS -->
                <div class="px-3 py-2 flex gap-2 overflow-x-auto scrollbar-hide" style="background-color: var(--bg-main)">
                    <button class="filter-btn active px-4 py-1.5 rounded-full text-sm whitespace-nowrap" data-filter="todos" style="background-color: var(--verde); color: var(--bg-main)">Todos</button>
                    <button class="filter-btn px-4 py-1.5 rounded-full text-sm whitespace-nowrap" data-filter="no-leidos" style="background-color: var(--bg-input); color: var(--text-secondary)">No leídos <span id="unreadCount">7</span></button>
                    <button class="filter-btn px-4 py-1.5 rounded-full text-sm whitespace-nowrap" data-filter="favoritos" style="background-color: var(--bg-input); color: var(--text-secondary)">Favoritos</button>
                    <button class="filter-btn px-4 py-1.5 rounded-full text-sm whitespace-nowrap" data-filter="grupos" style="background-color: var(--bg-input); color: var(--text-secondary)">Grupos <span id="groupCount">3</span></button>
                </div>

                <!-- TAB PAGES -->
                <div class="flex-1 overflow-hidden">
                    <!-- CHATS TAB -->
                    <div id="chatsTab" class="tab-page active flex-col">
                        <div class="px-4 py-2 flex items-center gap-3 hover:bg-[#202c33] cursor-pointer" id="archivedBtn" style="background-color: var(--bg-main)">
                            <svg class="w-6 h-6" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                            <span style="color: var(--text-primary)">Archivados</span>
                            <span class="ml-auto text-sm" style="color: var(--text-secondary)" id="archivedCount">0</span>
                        </div>
                        <div id="chatList" class="flex-1 overflow-y-auto scrollbar-hide" style="background-color: var(--bg-main)"></div>
                    </div>

                    <!-- NOVEDADES TAB -->
                    <div id="novedadesTab" class="tab-page flex-col" style="background-color: var(--bg-main)">
                        <div class="p-4">
                            <div class="flex items-center gap-3 mb-4 cursor-pointer" id="myStatusBtn">
                                <div class="w-14 h-14 rounded-full flex items-center justify-center relative" style="background-color: var(--bg-input)">
                                    <div class="w-14 h-14 bg-[#6b7c85] rounded-full flex items-center justify-center text-white text-xl overflow-hidden" id="myStatusAvatar">J</div>
                                    <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full flex items-center justify-center" style="background-color: var(--verde)">
                                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                                    </div>
                                <div class="flex-1">
                                    <p class="font-medium" style="color: var(--text-primary)">Mi estado</p>
                                    <p class="text-sm" style="color: var(--text-secondary)">Toca para añadir una actualización</p>
                                </div>
                            <p class="text-sm mb-2" style="color: var(--text-secondary)">Recientes</p>
                            <div id="statusList"></div>
                        </div>
                    </div>

                    <!-- COMUNIDADES TAB -->
                    <div id="comunidadesTab" class="tab-page flex-col items-center justify-center text-center px-6" style="background-color: var(--bg-main)">
                        <div class="mb-6">
                            <svg class="w-32 h-32 mx-auto" viewBox="0 0 100" fill="none">
                                <rect x="20" y="20" width="60" height="60" rx="8" fill="#D9FDD3"/>
                                <circle cx="35" cy="35" r="3" fill="#111b21"/>
                                <circle cx="45" cy="35" r="3" fill="#111b21"/>
                                <circle cx="55" cy="35" r="3" fill="#111b21"/>
                                <path d="M30 45 L35 50 L30 55" stroke="#111b21" stroke-width="2" fill="none"/>
                                <rect x="60" y="15" width="20" height="30" rx="2" fill="#00a884" transform="rotate(15 70 30)"/>
                                <rect x="25" y="60" width="25" height="20" rx="4" fill="#00a884"/>
                                <circle cx="55" cy="65" r="8" fill="white"/>
                            </svg>
                        </div>
                        <h2 class="text-2xl font-normal mb-3" style="color: var(--text-primary)">Usa una comunidad para<br>mantenerte en contacto</h2>
                        <p class="text-sm mb-6 px-4" style="color: var(--text-secondary)">
                            Las comunidades reúnen a los miembros en grupos por temas y facilitan la recepción de avisos de los administradores. Cualquier comunidad a la que te añadan aparecerá aquí.
                        </p>
                        <button id="createCommunityBtn" class="px-8 py-3 rounded-full font-medium mb-8" style="background-color: var(--verde); color: var(--bg-main)">
                            Iniciar tu comunidad
                        </button>
                        <p class="text-xs" style="color: var(--text-secondary)">
                            Toca <span style="color: var(--verde)">+</span> en la pestaña Chats para crear una nueva comunidad.
                        </p>
                    </div>

                    <!-- LLAMADAS TAB -->
                    <div id="llamadasTab" class="tab-page flex-col" style="background-color: var(--bg-main)">
                        <div class="px-4 py-3 flex gap-4 overflow-x-auto scrollbar-hide" style="background-color: var(--bg-main)">
                            <div class="flex flex-col items-center gap-1 min-w- cursor-pointer" id="newCallBtn">
                                <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: var(--bg-input)">
                                    <svg class="w-6 h-6" style="color: var(--text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                </div>
                                <span class="text-xs" style="color: var(--text-secondary)">Llamar</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 min-w-">
                                <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: var(--bg-input)">
                                    <svg class="w-6 h-6" style="color: var(--text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                </div>
                                <span class="text-xs" style="color: var(--text-secondary)">Programar</span>
                            </div>
                            <div class="flex flex-col items-center gap-1 min-w-">
                                <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: var(--bg-input)">
                                    <svg class="w-6 h-6" style="color: var(--text-primary)" fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                                </div>
                                <span class="text-xs" style="color: var(--text-secondary)">Teclado</span>
                            </div>
                        </div>
                        <div class="px-4 py-2">
                            <h2 class="text-base font-medium" style="color: var(--text-primary)">Recientes</h2>
                        </div>
                        <div id="callsList" class="flex-1 overflow-y-auto scrollbar-hide" style="background-color: var(--bg-main)"></div>
                    </div>
                </div>

                <!-- BOTTOM NAV -->
                <div class="flex items-center justify-around py-2 border-t" style="background-color: var(--bg-header); border-color: var(--bg-input)">
                    <button class="tab-btn flex flex-col items-center gap-1 px-4 py-1" data-tab="chats">
                        <div class="relative">
                            <svg class="w-6 h-6" style="color: var(--text-primary)" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
                            <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full text-xs flex items-center justify-center text-white" id="unreadBadge" style="background-color: var(--badge); display: none;">7</span>
                        </div>
                        <span class="text-xs" style="color: var(--text-primary)">Chats</span>
                    </button>
                    <button class="tab-btn flex flex-col items-center gap-1 px-4 py-1" data-tab="novedades">
                        <svg class="w-6 h-6" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <span class="text-xs" style="color: var(--text-secondary)">Novedades</span>
                    </button>
                    <button class="tab-btn flex flex-col items-center gap-1 px-4 py-1" data-tab="comunidades">
                        <svg class="w-6 h-6" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span class="text-xs" style="color: var(--text-secondary)">Comunidades</span>
                    </button>
                    <button class="tab-btn flex flex-col items-center gap-1 px-4 py-1" data-tab="llamadas">
                        <svg class="w-6 h-6" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        <span class="text-xs" style="color: var(--text-secondary)">Llamadas</span>
                    </button>
                </div>

                <!-- FLOATING ACTION BUTTON -->
                <button id="fabBtn" class="fixed bottom-20 right-4 w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg" style="background-color: var(--verde)">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
            </div>
            <!-- AJUSTES COMPLETO -->
            <div id="configPage" class="page flex-col" style="background-color: var(--bg-main)">
                <header class="px-4 py-4 flex items-center justify-between" style="background-color: var(--bg-header)">
                    <div class="flex items-center gap-6">
                        <button id="backFromConfig" class="p-1">
                            <svg class="w-6 h-6" style="color: var(--text-primary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h1 class="text-xl" style="color: var(--text-primary)">Ajustes</h1>
                    </div>

            </div>
            <script>
        // VARIABLES GLOBALES
        let chatsData = [];
        let contactsData = [];
        let statusData = [];
        let callsData = [];
        let archivedPassword = localStorage.getItem('archivedPassword') || null;
        let restrictedPassword = localStorage.getItem('restrictedPassword') || null;
        let currentChatFilter = null;
        let currentTab = 'chats';
        let currentUser = null;
        let selectedChatId = null;

        // CHATS DEMO
        const demoChats = [

            { id: '14', name: 'Hercules Ferrus 🚗🔧', avatar: 'H', lastMsg: 'Ya ya jhonatan', time: '4:06 p.m.', unread: 0, pinned: false, archived: false, restricted: false, isGroup: false, isFavorite: false },
            { id: '15', name: 'COMPRA Y VENTA DE CASA C...', avatar: 'C', lastMsg: 'Tú: Escribiendo...', time: '4:04 p.m.', unread: 0, pinned: false, archived: false, restricted: false, isGroup: true, isFavorite: false },
            { id: '16', name: 'Beto JPRO EIRL', avatar: 'B', lastMsg: 'Tú: Tío te llamo', time: '4:03 p.m.', unread: 0, pinned: false, archived: false, restricted: false, isGroup: false, isFavorite: false }
        ];

        const demoStatus = [
            { id: 's1', name: 'SARA DEL PINO', avatar: 'S', time: 'Hace 14 minutos', seen: false },
            { id: 's2', name: 'Mi prima Lola', avatar: 'M', time: 'Hace 35 minutos', seen: false },
            { id: 's3', name: 'Doris en Ferreyros', avatar: 'D', time: 'Hace 1 hora', seen: false },
            { id: 's4', name: 'Mirian, Delivery 🛵', avatar: 'M', time: 'Hace 2 horas', seen: true },
            { id: 's5', name: 'WESHU UA 31', avatar: 'W', time: 'Hace 4 horas', seen: true }
        ];

        const demoCalls = [
            { id: 'c1', name: 'ING. GENARO PECHE', avatar: 'I', time: 'Hoy, 2:15 p.m.', type: 'outgoing', missed: false, video: false },
            { id: 'c2', name: 'Mami', avatar: 'M', time: 'Hoy, 1:30 p.m.', type: 'incoming', missed: false, video: true },
            { id: 'c3', name: 'Beto JPRO EIRL', avatar: 'B', time: 'Ayer, 8:45 p.m.', type: 'incoming', missed: true, video: false },
            { id: 'c4', name: 'Mi Tía Carmen', avatar: 'M', time: 'Ayer, 5:20 p.m.', type: 'outgoing', missed: false, video: true }
        ];

        // INICIALIZAR
        function init() {
            chatsData = [...demoChats];
            statusData = [...demoStatus];
            callsData = [...demoCalls];
            
            setupEventListeners();
            renderChats();
            renderStatus();
            renderCalls();
            updateCounts();
            checkAuth();
        }

        // LOGIN SOLO NÚMERO
        function handleLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if (!phone || phone.length < 9) {
                errorMsg.textContent = 'Ingresa un número válido de 9 dígitos';
                return;
            }

            currentUser = {
                phone: '+51' + phone,
                name: '.',
                status: 'Me relajo con...',
                uid: 'demo_' + phone
            };

            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('mainPage').classList.add('active');
            loadUserData();
        }

        // CARGAR DATOS USUARIO
        function loadUserData() {
            if (!currentUser) return;
            document.getElementById('configUserName').textContent = currentUser.name;
            document.getElementById('configUserPhone').textContent = currentUser.phone;
            document.getElementById('configUserStatus').textContent = currentUser.status;
            document.getElementById('myStatusAvatar').textContent = currentUser.name.charAt(0);
        }

        // CHECK AUTH
        function checkAuth() {
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('mainPage').classList.add('active');
                loadUserData();
            }
        }

        // EVENT LISTENERS
        function setupEventListeners() {
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('phoneInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // TABS
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            // FILTROS
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => filterChats(btn.dataset.filter));
            });

            // MENU
            document.getElementById('menuBtn').addEventListener('click', toggleMenu);
            document.getElementById('configBtn').addEventListener('click', showConfig);
            document.getElementById('backFromConfig').addEventListener('click', hideConfig);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('perfilBtn').addEventListener('click', showProfile);
            document.getElementById('backFromProfile').addEventListener('click', hideProfile);

            // ARCHIVADOS
            document.getElementById('archivedBtn').addEventListener('click', showArchived);
            document.getElementById('backFromArchived').addEventListener('click', hideArchived);
            document.getElementById('unlockArchivedBtn').addEventListener('click', unlockArchived);

            // RESTRINGIDOS
            document.getElementById('restrictedBtn').addEventListener('click', showRestricted);
            document.getElementById('backFromRestricted').addEventListener('click', hideRestricted);
            document.getElementById('unlockRestrictedBtn').addEventListener('click', unlockRestricted);
            document.getElementById('useFingerprintBtn').addEventListener('click', useFingerprint);

            // BUSCAR
            document.getElementById('searchInput').addEventListener('input', (e) => searchChats(e.target.value));
        }
        // FAB
            document.getElementById('fabBtn').addEventListener('click', () => {
                document.getElementById('addContactModal').classList.remove('hidden');
            });

            // MODALES
            document.getElementById('cancelContactBtn').addEventListener('click', () => {
                document.getElementById('addContactModal').classList.add('hidden');
            });
            document.getElementById('saveContactBtn').addEventListener('click', saveContact);

            document.getElementById('myStatusBtn').addEventListener('click', () => {
                document.getElementById('addStatusModal').classList.remove('hidden');
            });
            document.getElementById('cancelStatusBtn').addEventListener('click', () => {
                document.getElementById('addStatusModal').classList.add('hidden');
            });
            document.getElementById('saveStatusBtn').addEventListener('click', saveStatus);

            // PERFIL
            document.getElementById('changePicBtn').addEventListener('click', () => {
                document.getElementById('profilePicInput').click();
            });
            document.getElementById('profilePicInput').addEventListener('change', handleProfilePic);
            document.getElementById('saveProfileBtn').addEventListener('click', saveProfile);

            // CHAT OPTIONS
            document.getElementById('cancelChatOptionsBtn').addEventListener('click', () => {
                document.getElementById('chatOptionsModal').classList.add('hidden');
            });
            document.getElementById('pinChatBtn').addEventListener('click', togglePinChat);
            document.getElementById('archiveChatBtn').addEventListener('click', toggleArchiveChat);
            document.getElementById('restrictChatBtn').addEventListener('click', toggleRestrictChat);
            document.getElementById('deleteChatBtn').addEventListener('click', deleteChat);

            // PASSWORD MODAL
            document.getElementById('cancelPasswordBtn').addEventListener('click', () => {
                document.getElementById('passwordModal').classList.add('hidden');
            });
            document.getElementById('savePasswordBtn').addEventListener('click', savePassword);

            // LLAMADAS
            document.getElementById('newCallBtn').addEventListener('click', () => {
                alert('Función de llamada próximamente');
            });

            // CERRAR MENU AL HACER CLICK FUERA
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#menuBtn') && !e.target.closest('#menuDropdown')) {
                    document.getElementById('menuDropdown').classList.add('hidden');
                }
            });
        }

        // SWITCH TAB
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const icon = btn.querySelector('svg');
                const text = btn.querySelector('span');
                if (btn.dataset.tab === tab) {
                    icon.style.color = 'var(--text-primary)';
                    text.style.color = 'var(--text-primary)';
                    if (tab === 'chats') document.getElementById('unreadBadge').style.display = 'none';
                } else {
                    icon.style.color = 'var(--text-secondary)';
                    text.style.color = 'var(--text-secondary)';
                }
            });

            document.getElementById('fabBtn').style.display = tab === 'chats' ? 'flex' : 'none';
        }

        // TOGGLE MENU
        function toggleMenu() {
            document.getElementById('menuDropdown').classList.toggle('hidden');
        }

        // MOSTRAR CONFIG
        function showConfig() {
            document.getElementById('mainPage').classList.remove('active');
            document.getElementById('configPage').classList.add('active');
            document.getElementById('menuDropdown').classList.add('hidden');
        }

        function hideConfig() {
            document.getElementById('configPage').classList.remove('active');
            document.getElementById('mainPage').classList.add('active');
        }

        // PERFIL
        function showProfile() {
            document.getElementById('configPage').classList.remove('active');
            document.getElementById('profilePage').classList.add('active');
            document.getElementById('nameInput').value = currentUser.name;
            document.getElementById('statusInput').value = currentUser.status;
        }

        function hideProfile() {
            document.getElementById('profilePage').classList.remove('active');
            document.getElementById('configPage').classList.add('active');
        }

        // FILTRAR CHATS
        function filterChats(filter) {
            currentChatFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.style.backgroundColor = 'var(--verde)';
                    btn.style.color = 'var(--bg-main)';
                } else {
                    btn.style.backgroundColor = 'var(--bg-input)';
                    btn.style.color = 'var(--text-secondary)';
                }
            });
            renderChats();
        }

        // LOGOUT
        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }
        // RENDERIZAR CHATS
        function renderChats() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            
            let filtered = [...chatsData].filter(c => !c.archived && !c.restricted);
            
            if (currentChatFilter === 'favoritos') {
                filtered = filtered.filter(c => c.isFavorite);
            } else if (currentChatFilter === 'grupos') {
                filtered = filtered.filter(c => c.isGroup);
            } else if (currentChatFilter === 'no-leidos') {
                filtered = filtered.filter(c => c.unread > 0);
            }
            
            filtered.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return 0;
            });
            
            filtered.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 flex items-center gap-3 hover:bg-[#202c33] cursor-pointer chat-item';
                div.dataset.chatId = chat.id;
                
                const unreadClass = chat.unread > 0 ? 'font-semibold' : '';
                const pinIcon = chat.pinned ? '<svg class="w-4 h-4" style="color: var(--text-secondary)" fill="currentColor" viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"></path></svg>' : '';
                const notDeliveredIcon = chat.notDelivered ? '<svg class="w-4 h-4 mr-1" style="color: var(--text-secondary)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' : '';
                
                div.innerHTML = `
                    <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: #6b7c85">
                        <span class="text-white text-lg">${chat.avatar}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-1">
                                <p class="text-base ${unreadClass} truncate" style="color: var(--text-primary)">${chat.name}</p>
                                ${pinIcon}
                            </div>
                            <div class="flex items-center gap-1">
                                <span class="text-xs" style="color: ${chat.unread > 0 ? 'var(--verde)' : 'var(--text-secondary)'}">${chat.time}</span>
                            </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center flex-1 min-w-0">
                                ${notDeliveredIcon}
                                <p class="text-sm truncate ${unreadClass}" style="color: var(--text-secondary)">${chat.lastMsg}</p>
                            </div>
                            ${chat.unread > 0 ? `<div class="w-5 h-5 rounded-full flex items-center justify-center ml-2 flex-shrink-0" style="background-color: var(--verde)"><span class="text-xs font-semibold" style="color: var(--bg-main)">${chat.unread}</span></div>` : ''}
                        </div>
                    </div>
                `;
                
                // CLICK PARA ABRIR CHAT
                div.addEventListener('click', () => openChat(chat.id));
                
                // LONG PRESS PARA OPCIONES
                let pressTimer;
                div.addEventListener('mousedown', (e) => {
                    pressTimer = setTimeout(() => {
                        selectedChatId = chat.id;
                        showChatOptions(chat);
                    }, 500);
                });
                div.addEventListener('mouseup', () => clearTimeout(pressTimer));
                div.addEventListener('mouseleave', () => clearTimeout(pressTimer));
                
                // MOBILE TOUCH
                div.addEventListener('touchstart', (e) => {
                    pressTimer = setTimeout(() => {
                        selectedChatId = chat.id;
                        showChatOptions(chat);
                    }, 500);
                });
                div.addEventListener('touchend', () => clearTimeout(pressTimer));
                
                container.appendChild(div);
            });
        }

        // BUSCAR CHATS
        function searchChats(query) {
            const container = document.getElementById('chatList');
            const items = container.querySelectorAll('.chat-item');
            const searchTerm = query.toLowerCase().trim();
            
            items.forEach(item => {
                const chatId = item.dataset.chatId;
                const chat = chatsData.find(c => c.id === chatId);
                if (chat.name.toLowerCase().includes(searchTerm) || chat.lastMsg.toLowerCase().includes(searchTerm)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ACTUALIZAR CONTADORES
        function updateCounts() {
            const totalUnread = chatsData.filter(c => c.unread > 0 && !c.archived && !c.restricted).length;
            const badge = document.getElementById('unreadBadge');
            if (totalUnread > 0) {
                badge.textContent = totalUnread;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // ABRIR CHAT
        function openChat(chatId) {
            const chat = chatsData.find(c => c.id === chatId);
            if (!chat) return;
            
            // Marcar como leído
            chat.unread = 0;
            renderChats();
            updateCounts();
            
            alert('Abriendo chat con: ' + chat.name + '\n\nAquí iría la pantalla de conversación completa');
        }

            document.getElementById('archiveChatBtn').textContent = chat.archived ? 'Desarchivar chat' : 'Archivar chat';
            document.getElementById('restrictChatBtn').textContent = chat.restricted ? 'Quitar restricción' : 'Restringir chat';

        // FIREBASE CONFIG - REEMPLAZA CON TUS CREDENCIALES
        const firebaseConfig = {

            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // RENDERIZAR ESTADOS
        function renderStatus() {
            const container = document.getElementById('statusList');
            container.innerHTML = '';
            
            // Mi estado
            const myStatus = document.createElement('div');
            myStatus.className = 'px-4 py-3 flex items-center gap-3';
            myStatus.innerHTML = `
                <div class="w-12 h-12 bg-[#6b7c85] rounded-full flex items-center justify-center text-white text-lg" id="myStatusAvatar">
                    ${currentUser ? currentUser.name.charAt(0) : 'J'}
                </div>
                <div class="flex-1">
                    <p class="text-base" style="color: var(--text-primary)">Mi estado</p>
                    <p class="text-sm" style="color: var(--text-secondary)">Añade una actualización</p>
                </div>
            `;

            const sep = document.createElement('div');
            sep.className = 'px-4 py-2';
            sep.innerHTML = '<p class="text-sm font-medium" style="color: var(--text-secondary)">Actualizaciones recientes</p>';
            container.appendChild(sep);
            
            // Estados de contactos
            statusData.forEach(status => {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 flex items-center gap-3 hover:bg-[#202c33] cursor-pointer';
                const ringColor = status.seen ? 'var(--text-secondary)' : 'var(--verde)';

                    <div class="w-12 h-12 rounded-full p-0.5" style="background: ${ringColor}">

                        <p class="text-sm" style="color: var(--text-secondary)">${status.time}</p>
                    </div>

                    <div class="flex-1">
                        <p class="text-base ${call.missed ? 'font-semibold' : ''}" style="color: ${call.missed ? '#f44336' : 'var(--text-primary)'}">${call.name}</p>
                        <div class="flex items-center gap-1">

        // ARCHIVADOS
        function showArchived() {
            document.getElementById('mainPage').classList.remove('active');
            document.getElementById('archivedPage').classList.add('active');
            document.getElementById('menuDropdown').classList.add('hidden');
            
            if (!archivedPassword) {
                showPasswordModal('archived', 'Crear contraseña para Archivados');
            }
        }

        function hideArchived() {
            document.getElementById('archivedPage').classList.remove('active');
            document.getElementById('mainPage').classList.add('active');
        }

        function unlockArchived() {
            const input = document.getElementById('archivedPasswordInput').value;
            const errorMsg = document.getElementById('archivedErrorMsg');
            
            if (input === archivedPassword) {
                document.getElementById('archivedLockScreen').classList.add('hidden');
                document.getElementById('archivedChatList').classList.remove('hidden');
                renderArchivedChats();
            } else {
                errorMsg.textContent = 'Contraseña incorrecta';
                setTimeout(() => errorMsg.textContent = '', 3000);
            }
        }

        function renderArchivedChats() {
            const container = document.getElementById('archivedChatList');
            container.innerHTML = '';
            const archived = chatsData.filter(c => c.archived);
            
            archived.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 flex items-center gap-3 hover:bg-[#202c33] cursor-pointer';
                div.innerHTML = `
                    <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color: #6b7c85">
                        <span class="text-white text-lg">${chat.avatar}</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-base" style="color: var(--text-primary)">${chat.name}</p>
                        <p class="text-sm" style="color: var(--text-secondary)">${chat.lastMsg}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        // RESTRINGIDOS
        function showRestricted() {
            document.getElementById('mainPage').classList.remove('active');
            document.getElementById('restrictedPage').classList.add('active');
            document.getElementById('menuDropdown').classList.add('hidden');
            
            if (!restrictedPassword) {
                showPasswordModal('restricted', 'Crear contraseña para Restringidos');
            }
        }

        function hideRestricted() {
            document.getElementById('restrictedPage').classList.remove('active');
            document.getElementById('mainPage').classList.add('active');
        }

        function unlockRestricted() {
            const input = document.getElementById('restrictedPasswordInput').value;
            const errorMsg = document.getElementById('restrictedErrorMsg');
            
            if (input === restrictedPassword) {
                document.getElementById('restrictedLockScreen').classList.add('hidden');
                document.getElementById('restrictedChatList').classList.remove('hidden');
                renderRestrictedChats();
            } else {
                errorMsg.textContent = 'Contraseña incorrecta';
                setTimeout(() => errorMsg.textContent = '', 3000);
            }
        }

        function useFingerprint() {
            // Simulación de huella - en producción usar WebAuthn API
            if (navigator.credentials) {
                alert('Coloca tu dedo en el sensor...');
                setTimeout(() => {
                    if (restrictedPassword) {
                        document.getElementById('restrictedLockScreen').classList.add('hidden');
                        document.getElementById('restrictedChatList').classList.remove('hidden');
                        renderRestrictedChats();
                    }
                }, 1500);
            } else {
                alert('Tu dispositivo no soporta huella digital');
            }
        }

        function renderRestrictedChats() {
            const container = document.getElementById('restrictedChatList');
            container.innerHTML = '';
            const restricted = chatsData.filter(c => c.restricted);
            
            restricted.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'px-4 py-3 flex items-center gap-3 hover:bg-[#202c33] cursor-pointer';
                div.innerHTML = `
                    <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color: #6b7c85">
                        <span class="text-white text-lg">${chat.avatar}</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <p class="text-base" style="color: var(--text-primary)">${chat.name}</p>

                        </div>
                        <p class="text-sm" style="color: var(--text-secondary)">${chat.lastMsg}</p>
                    </div>

                container.appendChild(div);

        // MODAL CONTRASEÑA
        function showPasswordModal(type, title) {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('passwordModalTitle').textContent = title;
            document.getElementById('passwordModalDesc').textContent = type === 'archived' ? 'Esta contraseña protegerá tus chats archivados' : 'Esta contraseña protegerá tus chats restringidos';
            document.getElementById('savePasswordBtn').dataset.type = type;
        }

        function savePassword() {
            const type = document.getElementById('savePasswordBtn').dataset.type;
            const newPass = document.getElementById('newPasswordInput').value;
            const confirmPass = document.getElementById('confirmPasswordInput').value;
            
            if (!newPass || newPass.length < 4) {
                alert('La contraseña debe tener al menos 4 caracteres');
                return;
            }
            
            if (newPass !== confirmPass) {
                alert('Las contraseñas no coinciden');
                return;
            }
            
            if (type === 'archived') {
                archivedPassword = newPass;
                localStorage.setItem('archivedPassword', newPass);
                document.getElementById('archivedLockScreen').classList.add('hidden');
                document.getElementById('archivedChatList').classList.remove('hidden');
                renderArchivedChats();
            } else {
                restrictedPassword = newPass;
                localStorage.setItem('restrictedPassword', newPass);
                document.getElementById('restrictedLockScreen').classList.add('hidden');
                document.getElementById('restrictedChatList').classList.remove('hidden');
                renderRestrictedChats();
            }
            
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('confirmPasswordInput').value = '';
        }

        // TOGGLE ANCLAR CHAT
        function togglePinChat() {
            const chat = chatsData.find(c => c.id === selectedChatId);
            if (chat) {
                chat.pinned = !chat.pinned;
                renderChats();
                document.getElementById('chatOptionsModal').classList.add('hidden');
            }
        }

        // TOGGLE ARCHIVAR CHAT
        function toggleArchiveChat() {
            const chat = chatsData.find(c => c.id === selectedChatId);
            if (chat) {
                if (!chat.archived && !archivedPassword) {
                    showPasswordModal('archived', 'Crear contraseña para Archivados');
                    document.getElementById('chatOptionsModal').classList.add('hidden');
                    return;
                }
                chat.archived = !chat.archived;
                renderChats();
                document.getElementById('chatOptionsModal').classList.add('hidden');
            }
        }

        // TOGGLE RESTRINGIR CHAT
        function toggleRestrictChat() {
            const chat = chatsData.find(c => c.id === selectedChatId);
            if (chat) {
                if (!chat.restricted && !restrictedPassword) {
                    showPasswordModal('restricted', 'Crear contraseña para Restringidos');
                    document.getElementById('chatOptionsModal').classList.add('hidden');
                    return;
                }
                chat.restricted = !chat.restricted;
                renderChats();
                document.getElementById('chatOptionsModal').classList.add('hidden');
            }
        }

        // ELIMINAR CHAT
        function deleteChat() {
            if (confirm('¿Eliminar este chat? Esta acción no se puede deshacer.')) {
                chatsData = chatsData.filter(c => c.id !== selectedChatId);
                renderChats();
                updateCounts();
                document.getElementById('chatOptionsModal').classList.add('hidden');
            }
        }
        // GUARDAR CONTACTO
        function saveContact() {
            const phone = document.getElementById('contactPhoneInput').value.trim();
            const name = document.getElementById('contactNameInput').value.trim();

            if (!phone ||!name) {
                alert('Completa todos los campos');
                return;
            }

            const newContact = {
                id: 'contact_' + Date.now(),
                phone: '+51' + phone,
                name: name,
                avatar: name.charAt(0).toUpperCase()
            };

            contactsData.push(newContact);

            // Crear chat automáticamente
            const newChat = {
                id: 'chat_' + Date.now(),
                name: name,
                avatar: name.charAt(0).toUpperCase(),
                lastMsg: 'Nuevo contacto',
                time: new Date().toLocaleTimeString('es-PE', {hour: '2-digit', minute: '2-digit'}),
                unread: 0,
                pinned: false,
                archived: false,
                restricted: false,
                isGroup: false,
                isFavorite: false
            };

            chatsData.unshift(newChat);
            renderChats();
            updateCounts();

            document.getElementById('addContactModal').classList.add('hidden');
            document.getElementById('contactPhoneInput').value = '';
            document.getElementById('contactNameInput').value = '';

            // TODO: Guardar en Firebase
            // firebase.firestore().collection('users').doc(currentUser.uid).collection('contacts').add(newContact);
        }

        // GUARDAR ESTADO
        function saveStatus() {
            const text = document.getElementById('statusTextInput').value.trim();
            const imageInput = document.getElementById('statusImageInput');

            if (!text &&!imageInput.files[0]) {
                alert('Añade texto o una imagen');
                return;
            }

            const newStatus = {
                id: 'status_' + Date.now(),
                name: currentUser.name,
                avatar: currentUser.name.charAt(0).toUpperCase(),
                time: 'Ahora',
                seen: false,
                text: text,
                image: null
            };

            // Si hay imagen, subirla a Firebase Storage
            if (imageInput.files[0]) {

                // const storageRef = firebase.storage().ref();

                // imageRef.put(imageInput.files[0]).then(snapshot => {
                // snapshot.ref.getDownloadURL().then(url => {
                // newStatus.image = url;
                // statusData.unshift(newStatus);
                // renderStatus();
                // });
                // });

                // Simulación sin Firebase
                newStatus.image = URL.createObjectURL(imageInput.files[0]);
            }

            statusData.unshift(newStatus);
            renderStatus();

            document.getElementById('addStatusModal').classList.add('hidden');
            document.getElementById('statusTextInput').value = '';
            document.getElementById('statusImageInput').value = '';
        }

        // MANEJAR FOTO DE PERFIL
        function handleProfilePic(e) {

            const reader = new FileReader();
            reader.onload = (event) => {
                const preview = document.getElementById('profilePicPreview');
                preview.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-cover rounded-full">`;

                // TODO: Subir a Firebase Storage
                // const storageRef = firebase.storage().ref();

                // snapshot.ref.getDownloadURL().then(url => {
                // currentUser.photoURL = url;
                // localStorage.setItem('currentUser', JSON.stringify(currentUser));
                // });
                // });
            };
            reader.readAsDataURL(file);
        }

        // GUARDAR PERFIL
        function saveProfile() {
            const name = document.getElementById('nameInput').value.trim();
            const status = document.getElementById('statusInput').value.trim();

            if (!name) {
                alert('El nombre es obligatorio');
                return;
            }

            currentUser.name = name;

            // status: status

        document.getElementById('selectStatusImageBtn').addEventListener('click', () => {
            document.getElementById('statusImageInput').click();

        // INICIALIZAR APP AL CARGAR
        document.addEventListener('DOMContentLoaded', init);
    </script>
