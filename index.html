<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JPRO Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-main: #111b21;
            --bg-header: #202c33;
            --bg-chat: #0b141a;
            --bg-input: #2a3942;
            --bg-msg-recibido: #202c33;
            --bg-msg-enviado: #005c4b;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --verde: #00a884;
            --borde: #2a3942;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
        }

       .scrollbar-hide::-webkit-scrollbar { display: none; }
       .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        input:focus { outline: 2px solid var(--verde); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // TU CONFIG DE FIREBASE YA PUESTA
        const firebaseConfig = {
          apiKey: "AIzaSyDWWb3B8oYYe_uiwllsDHsUtmzUv_SKcdU",
          authDomain: "jpro-chat.firebaseapp.com",
          projectId: "jpro-chat",
          storageBucket: "jpro-chat.firebasestorage.app",
          messagingSenderId: "533021046255",
          appId: "1:533021046255:web:0209ceff9564b1aa06721a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const app = document.getElementById('app');

        // TEMPLATES
        const LoginTemplate = `
            <div class="w-full h-full flex items-center justify-center bg-[#111b21] p-4">
                <div class="w-full max-w-sm">
                    <div class="text-center mb-10">
                        <div class="w-20 h-20 bg-[#00a884] rounded-full mx-auto mb-4 flex items-center justify-center">
                            <svg class="w-11 h-11 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.449C18.24 1.245 15.24 0.002 12.045 0 5.463 0.095 5.369.095 11.95c0 2.109.546 4.131 1.585 5.936L0 24l6.306-1.651c1.724.941 3.665 1.438 5.738 1.438h.005c6.581 0 11.95-5.368 11.95-11.95 0-3.194-1.242-6.194-3.479-8.388zM12.05 21.833c-1.821 0-3.606-.49-5.16-1.415l-.369-.219-3.741.98.998-3.647-.24-.374c-1.001-1.563-1.531-3.379-1.531-5.208 0-5.416 4.406-9.822 9.823-9.822 2.623 0 5.089 1.023 6.942 2.877 1.854 1.854 2.876 4.319 2.876 6.942 0 5.417-4.407 9.823-9.823 9.823zm5.398-7.349c-.296-.148-1.747-.862-2.018-.961-.271-.099-.469-.148-.667.148-.198.297-.764.961-.936 1.158-.173.198-.346.223-.642.074-.297-.148-1.254-.463-2.389-1.475-.883-.788-1.479-1.761-1.652-2.058-.173-.297-.018-.458.13-.605.134-.133.297-.347.445-.52.148-.174.198-.297.297-.495.099-.198.05-.371-.025-.519-.074-.148-.667-1.607-.914-2.201-.24-.578-.484-.499-.667-.509-.173-.01-.371-.012-.569-.012-.198 0-.519.074-.791.371s-1.039 1.015-1.039 2.475 1.064 2.871 1.212 3.068c.148.198 2.093 3.196 5.072 4.482.709.306 1.261.489 1.693.626.711.226 1.358.194 1.869.118.57-.085 1.747-.714 1.994-1.403.247-.69.247-1.281.173-1.403-.074-.122-.272-.196-.569-.345z"/></svg>
                        </div>
                        <h1 class="text-3xl font-light text-[#e9edef]">JPRO</h1>
                        <p class="text-[#8696a0] mt-2">Inicia sesión con tu correo</p>
                    </div>
                    <div class="space-y-3">
                        <div class="flex bg-[#2a3942] rounded-lg items-center px-4">
                            <svg class="w-5 h-5 text-[#8696a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                            <input id="email" type="email" placeholder="Correo electrónico" class="w-full py-3 bg-transparent text-[#e9edef] placeholder-[#8696a0] border-0 focus:ring-0">
                        </div>
                        <div class="flex bg-[#2a3942] rounded-lg items-center px-4">
                            <svg class="w-5 h-5 text-[#8696a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <input id="password" type="password" placeholder="Contraseña" class="w-full py-3 bg-transparent text-[#e9edef] placeholder-[#8696a0] border-0 focus:ring-0">
                        </div>
                        <button id="loginBtn" class="w-full py-3 bg-[#00a884] text-[#111b21] font-semibold rounded-lg active:scale-95 transition">Iniciar sesión</button>
                        <button id="registerBtn" class="w-full py-3 text-[#00a884] text-sm">¿No tienes cuenta? Regístrate</button>
                    </div>
                    <p id="errorMsg" class="text-red-500 text-center mt-4 text-sm h-4"></p>
                </div>
            </div>
        `;

        const ChatTemplate = `
            <div class="w-full h-full flex bg-[#111b21]">
                <div id="sidebar" class="w-full md:w-[400px] lg:w-[420px] border-r border-[#2a3942] flex flex-col">
                    <header class="bg-[#202c33] px-4 py-2.5 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-[#6b7c85] rounded-full flex items-center justify-center text-white font-semibold">
                                <span id="userInitial">J</span>
                            </div>
                            <h1 class="text-xl font-medium text-[#e9edef]">JPRO</h1>
                        </div>
                        <div class="relative">
                            <button id="menuBtn" class="p-2 rounded-full hover:bg-[#2a3942] active:bg-[#374248]">
                                <svg class="w-6 h-6 text-[#aebac1]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2.9-2 2.9 2 2 2zm0 2c-1.1 0-2.9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2.9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                            </button>
                            <div id="menuDropdown" class="hidden absolute right-0 mt-1 w-52 bg-[#233138] rounded-md shadow-xl py-2 z-50">
                                <button id="newGroupBtn" class="block w-full text-left px-4 py-3 text-[15px] text-[#e9edef] hover:bg-[#2a3942]">Nuevo grupo</button>
                                <button id="perfilBtn" class="block w-full text-left px-4 py-3 text-[15px] text-[#e9edef] hover:bg-[#2a3942]">Perfil</button>
                                <div class="my-1 border-t border-[#2a3942]"></div>
                                <button id="logoutBtn" class="block w-full text-left px-4 py-3 text-[15px] text-[#e9edef] hover:bg-[#2a3942]">Cerrar sesión</button>
                            </div>
                        </div>
                    </header>
                    <div class="px-3 py-2 bg-[#111b21]">
                        <div class="bg-[#202c33] rounded-lg flex items-center px-4 py-1.5">
                            <svg class="w-5 h-5 text-[#8696a0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input type="text" placeholder="Buscar un chat" class="w-full bg-transparent text-[#e9edef] placeholder-[#8696a0] border-0 focus:ring-0 ml-3 text-sm">
                        </div>
                    </div>
                    <div id="groupList" class="flex-1 overflow-y-auto scrollbar-hide bg-[#111b21]">
                        <div class="p-8 text-center text-[#8696a0]">
                            <p class="text-lg">No tienes chats aún</p>
                            <p class="text-sm mt-2">Usa el menú ⋮ para crear un grupo</p>
                        </div>
                    </div>
                <div id="chatArea" class="hidden md:flex flex-1 items-center justify-center bg-[#0b141a] text-[#8696a0] border-b-[6px] border-[#00a884]">
                    <div class="text-center px-8">
                        <div class="w-80 h-80 mx-auto mb-8 opacity-20">
                            <svg viewBox="0 0 303 172" fill="#364147"><path d="M229.5 122.5c0 27.5-22.5 50-50 50h-50c-27.5 0-50-22.5-50-50s22.5-50 50-50h50c27.5 0 50 22.5 50 50z"></path></svg>
                        </div>
                        <p class="text-3xl font-light text-[#d1d7db] mb-3">JPRO Web</p>
                        <p class="text-sm text-[#8696a0]">Envía y recibe mensajes sin mantener tu teléfono conectado.</p>
                    </div>
                </div>
            </div>
        `;

        // LOGIC
        auth.onAuthStateChanged(user => {
            if (user) {
                renderChat(user);
            } else {
                renderLogin();
            }
        });

        function renderLogin() {
            app.innerHTML = LoginTemplate;
            document.getElementById('loginBtn').onclick = login;
            document.getElementById('registerBtn').onclick = register;

            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
        }

        function renderChat(user) {
            app.innerHTML = ChatTemplate;

            document.getElementById('userInitial').textContent = user.email[0].toUpperCase();

            const menuBtn = document.getElementById('menuBtn');
            const menuDropdown = document.getElementById('menuDropdown');

            menuBtn.onclick = (e) => {
                e.stopPropagation();
                menuDropdown.classList.toggle('hidden');
            };

            document.body.onclick = () => menuDropdown.classList.add('hidden');

            document.getElementById('logoutBtn').onclick = () => {
                auth.signOut();
            };

            document.getElementById('newGroupBtn').onclick = () => {
                const nombre = prompt('Nombre del grupo:');
                if (nombre) alert('Grupo "' + nombre + '" creado. Próximamente: sistema de chat completo');
                menuDropdown.classList.add('hidden');
            };

            document.getElementById('perfilBtn').onclick = () => {
                alert('Usuario: ' + user.email);
                menuDropdown.classList.add('hidden');
            };
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            if (!email ||!password) {
                errorMsg.textContent = 'Completa todos los campos';
                return;
            }

            loginBtn.textContent = 'Entrando...';
            loginBtn.disabled = true;

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                errorMsg.textContent = 'Error: ' + e.message;
                loginBtn.textContent = 'Iniciar sesión';
                loginBtn.disabled = false;
            }
        }

        async function register() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!email ||!password) {
                errorMsg.textContent = 'Completa todos los campos';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'La contraseña debe tener 6 caracteres mínimo';
                return;
            }

            try {
                await auth.createUserWithEmailAndPassword(email, password);
            } catch (e) {
                errorMsg.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
